name: Build Fuel Density APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug -PphoneTestBuild --no-daemon --stacktrace

      - name: Verify and name APK
        run: |
          apk="$PWD/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" Fuel-Density-Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fuel-Density-Test
          path: Fuel-Density-Test.apk
          if-no-files-found: error
